<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>Velocidad y viajes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="layout">
    <section class="hud" aria-live="off">
      <div class="speed-row">
        <span id="speed" class="speed">--</span>
        <span class="unit">km/h</span>
      </div>
      <div id="status" class="status">Toca “Iniciar GPS” para empezar</div>
      <div class="odo-row">
        <span class="odo-label">Odómetro</span>
        <span><span id="odo" class="odo">0.0</span> km</span>
      </div>
      <button id="gps-btn" type="button" class="primary">Iniciar GPS</button>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="trips" role="tab">Viajes</button>
        <button type="button" class="tab" data-tab="data" role="tab">Datos</button>
        <button type="button" class="tab" data-tab="diag" role="tab">Diagnóstico</button>
      </div>

      <div id="tab-trips" class="tab-body">
        <form id="new-trip" class="inline-form">
          <input id="trip-name" type="text" maxlength="40" placeholder="Nombre del viaje (opcional)" autocomplete="off">
          <button type="submit" class="primary">Nuevo</button>
        </form>
        <ul id="trip-list" class="trip-list"></ul>
        <p id="no-trips" class="hint">Sin viajes. Crea uno para medir distancia, tiempo y velocidad máxima.</p>
      </div>

      <div id="tab-data" class="tab-body" hidden>
        <form id="odo-form" class="inline-form">
          <input id="odo-input" type="number" inputmode="decimal" min="0" step="0.1" placeholder="Odómetro (km)">
          <button type="submit">Ajustar</button>
        </form>
        <p class="hint">Los datos se guardan en este navegador. Haz un respaldo por si Chrome borra los datos del sitio.</p>
        <textarea id="backup" rows="5" spellcheck="false" placeholder="Respaldo (JSON)"></textarea>
        <div class="btn-row">
          <button id="backup-make" type="button">Generar respaldo</button>
          <button id="backup-restore" type="button">Restaurar</button>
        </div>
        <p id="data-msg" class="hint"></p>
      </div>

      <div id="tab-diag" class="tab-body" hidden>
        <p id="diag-verdict" class="verdict">Inicia el GPS para ver el diagnóstico.</p>
        <table class="diag-table"><tbody id="diag-body"></tbody></table>
        <div class="btn-row">
          <button id="diag-reset" type="button">Reiniciar contadores</button>
        </div>
      </div>
    </section>
  </main>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
